<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>CV - Julian BRAILLON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #92d9ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px 20px;
        }

        img {
            width: 50%;
            border-radius: 16px;
            box-shadow: -6px 6px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        a {
            background-color: #005f8f;
            color: white;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            margin-bottom: 15px;
        }

        a:hover {
            background-color: white;
            color: #005f8f;
            border-color: #005f8f;
        }

        .back-link {
            background-color: transparent;
            color: #005f8f;
            border: 2px solid #005f8f;
            margin-top: 10px;
        }

        .back-link:hover {
            background-color: #005f8f;
            color: white;
            border-color: #005f8f;
        }
    </style>
</head>

<body>
    <a href="img/CV.png" download="BRAILLON_Julian_CV.png">Télécharger mon CV</a>
    <img src="img/CV.png" alt="Mon CV">
    <a href="index.html">Retour à l'accueil</a>
</body>

</html>
